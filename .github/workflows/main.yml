name: Build APK

# Manual build for testing on a phone. Run it from the Actions tab: "Build APK" -> "Run workflow".
# It builds the debug variant, which Gradle signs with the default debug key, so the APK
# installs directly. Its package name is xyz.mpv.rex.debug, so it sits next to the original app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The debug version name carries the commit count, which needs the full history.
          fetch-depth: 0

      - name: Locate project
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found. Commit the extracted project files (app/, gradlew, build.gradle.kts, ...) to the repository; a .zip file is not extracted by GitHub."
            echo "Repository contents:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Project found in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Build debug APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: List APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: ls -lah app/build/outputs/apk/debug/

      # arm64-v8a fits almost every modern phone; universal works on any device but is larger.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-arm64-v8a-debug-${{ env.SHORT_SHA }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-universal-debug-${{ env.SHORT_SHA }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
